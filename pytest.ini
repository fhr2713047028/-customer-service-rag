[pytest]
# 测试文件中的 async 测试函数无需手动加 @pytest.mark.asyncio
asyncio_mode = auto
# 关键：app/db/session.py 的 engine 是模块级单例，其连接池里的 asyncpg 连接
# 绑定在创建它们的事件循环上。若每个测试各用一个循环（function 作用域），
# 第二个测试会拿到"已死循环"的连接（RuntimeError: Event loop is closed）。
# 因此整个测试会话共享一个事件循环：
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# 让 pytest 能找到 app 包（从项目根目录运行 pytest 时）
pythonpath = .
testpaths = test
